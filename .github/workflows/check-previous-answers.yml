name: Update Wordle previous answers

on:
  schedule:
    - cron: '17 6 * * *' # 14:17 China time
    - cron: '17 7 * * *' # 15:17 China time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordle-previous-answers-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Show schedule diagnostics
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Triggered cron: ${SCHEDULE_EXPRESSION:-manual run}"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "China now: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "New York now: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.WORDLE_UPDATE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build proposed TXT and validation report
        id: check
        continue-on-error: true
        run: python scripts/check_previous_answers.py --days 30 --output-dir preview
      - name: Generate JSON files from proposed TXT
        run: |
          cp build_previous_answers_json.js preview/
          cd preview
          node build_previous_answers_json.js
          rm build_previous_answers_json.js
      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordle-previous-answers-preview
          path: preview/
          if-no-files-found: warn
          retention-days: 14
      - name: Flag verification issues
        if: steps.check.outcome == 'failure'
        run: |
          echo "Verification reported conflicts, errors, or duplicates. Inspect the artifact."
          exit 1
      - name: Commit verified new answers
        if: success() && steps.check.outcome == 'success'
        run: |
          set -euo pipefail
          if ! python -c 'import json; r=json.load(open("preview/verification_report.json")); assert not r["review"] and not r["fetch_errors"] and not r["existing_duplicate_lines"]; print(len(r["proposed_additions"]))' > /tmp/wordle-additions; then
            exit 1
          fi
          if [ "$(cat /tmp/wordle-additions)" = 0 ]; then
            echo "No new answers; no commit needed."
            exit 0
          fi
          for file in previous_answers.txt previous_answers.json previous_answers_repeated_words.json previous_answers_multi_answer_numbers.json previous_answers_summary.json; do
            test -s "preview/$file"
            cp "preview/$file" "$file"
            git add -- "$file"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "wordlelab-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Wordle previous answers"
          git push
