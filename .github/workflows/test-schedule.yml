name: Test GitHub Actions Schedule

on:
  schedule:
    - cron: '30 15 * * *' # 23:30 China time (UTC+8)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show time and calculate
        run: |
          echo "UTC time:"
          date -u
          echo "China time:"
          TZ=Asia/Shanghai date
          echo "1 + 1 = $((1 + 1))"
